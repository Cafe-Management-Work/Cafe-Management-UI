<mat-toolbar color="primary">
    <mat-toolbar-row fxLayout="row">
        <span>Signup</span>
        <span class="spacer"></span>
        <button mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </mat-toolbar-row>
</mat-toolbar>

<mat-dialog-content class="mat-typography">
    <form [formGroup]="signupForm">
     <div fxFlex fxLayout = "column">
       <mat-form-field appearance="standard" fxFlex>
         <mat-label>User Name</mat-label>
         <input matInput formControlName="username" required>
         <mat-error *ngIf="signupForm.controls.username.touched && signupForm.controls.username.invalid">
           <span *ngIf="signupForm.controls.username.errors.required">Username is required</span>
           <span *ngIf="signupForm.controls.username.errors.pattern">Username is not valid</span>
         </mat-error>
       </mat-form-field>

       <mat-form-field appearance="standard" fxFlex>
         <mat-label>Email</mat-label>
         <input matInput formControlName="email" required>
         <mat-error *ngIf="signupForm.controls.email.touched && signupForm.controls.email.invalid">
           <span *ngIf="signupForm.controls.email.errors.required">Email is required</span>
           <span *ngIf="signupForm.controls.email.errors.pattern">Email is not valid</span>
         </mat-error>
       </mat-form-field>

       <mat-form-field appearance="standard" fxFlex>
         <mat-label>contact number</mat-label>
         <input matInput formControlName="contactNumber" required>
         <mat-error *ngIf="signupForm.controls.contactNumber.touched && signupForm.controls.contactNumber.invalid">
           <span *ngIf="signupForm.controls.contactNumber.errors.required">Contact number is required</span>
           <span *ngIf="signupForm.controls.contactNumber.errors.pattern">Contact number is not valid</span>
         </mat-error>
       </mat-form-field>
       <mat-form-field appearance="standard" fxFlex>
         <mat-label>Password</mat-label>
         <input matInput formControlName="password" required [type]="password ? 'password' : 'text'">
         <button type="button" mat-icon-button matSuffix (click)="password = !password" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="password">
           <mat-icon>{{password ? 'visibility_off' : 'visibility'}}</mat-icon>
         </button>
         <mat-error *ngIf="signupForm.controls.password.touched && signupForm.controls.password.invalid">
           <span *ngIf="signupForm.controls.password.errors.required">Password is required</span>
         </mat-error>
       </mat-form-field>

       <mat-form-field appearance="standard" fxFlex>
         <mat-label>Confirm Password</mat-label>
         <input matInput formControlName="confirmPassword" required [type]="confirmPassword ? 'password' : 'text'">
         <button type="button" mat-icon-button matSuffix (click)="confirmPassword = !confirmPassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="confirmPassword">
           <mat-icon>{{confirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
         </button>
         <mat-error *ngIf="signupForm.controls.confirmPassword.touched && signupForm.controls.confirmPassword.invalid">
           <span *ngIf="signupForm.controls.confirmPassword.errors.required">Confirm Password is required</span>
         </mat-error>
       </mat-form-field>
       <mat-hint *ngIf="validateSubmit() && !(signupForm.controls.confirmPassword.invalid)">
         <span>New Password and Confirm Password must match</span>
       </mat-hint>
     </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" type="submit" (click)="handleSubmit()" 
  [disabled]="validateSubmit() || !(signupForm.valid && signupForm.dirty)" >
  <mat-icon>save</mat-icon>
  Signup</button>
  <button mat-raised-button color="warn" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</mat-dialog-actions>
